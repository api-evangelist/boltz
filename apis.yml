aid: boltz
name: Boltz
description: >-
  Boltz (Boltz PBC) is a public-benefit AI research company building open-source
  and proprietary foundation models for biomolecular structure prediction,
  binding-affinity estimation, and generative protein and small-molecule design.
  Its open-source models (Boltz-1, Boltz-2, BoltzGen, all MIT-licensed) are used
  by 100,000+ scientists across pharma and biotech, and its commercial platform,
  Boltz Lab, pairs those models with managed compute and collaborative interfaces.
  The Boltz Compute API exposes these capabilities as asynchronous jobs -
  structure & binding prediction, ADME prediction, and small-molecule / protein
  design and library screening - with official Python, TypeScript, and Go SDKs, a
  CLI, and an MCP server for agentic drug-discovery workflows. Backed by a $28M
  seed round led by Amplify Partners, a16z, and Zetta Venture Partners.
