command_surface:
  - group: auth
    purpose: Sign in, inspect the authenticated identity, manage credentials.
  - group: predictions
    purpose: Structure-and-binding and ADME prediction jobs.
  - group: small-molecule
    purpose: Small-molecule design and library-screen jobs.
  - group: protein
    purpose: Protein design and library-screen jobs.
  - group: share-links
    purpose: Create and manage shareable result links.
  - group: results
