description: Official Boltz MCP server, distributed as an MCP Bundle (.mcpb) named "boltz". Wraps the
  Boltz Compute API so agents can estimate/run structure & binding predictions, small-molecule and protein
  design/screening jobs, and download results. Node stdio server; installs the local boltz-api CLI it
  drives.
server:
  name: boltz
  version: 0.2.8
  transport: stdio
  runtime: node
  distribution: MCP Bundle (.mcpb)
  repo: https://github.com/boltz-bio/boltz-mcpb
  status: published
  authentication: Boltz API key / OAuth login via boltz_auth_login
tools:
- name: boltz_check_setup
  description: Check whether Boltz is ready to run jobs (access, authentication, local CLI).
- name: boltz_install_cli
  description: Install or update the local Boltz components required to run workflows.
- name: boltz_auth_login
  description: Start Boltz sign-in and return the login instructions needed to connect.
- name: boltz_get_guidance
  description: Read bundled Boltz workflow guidance before preparing payloads or calling tools.
- name: boltz_structure_and_binding
  description: Estimate and optionally start one structure-and-binding job, then poll/download.
- name: boltz_small_molecule_screen
  description: Estimate and optionally start one small-molecule library screen.
- name: boltz_small_molecule_design
  description: Estimate and optionally start one small-molecule design job.
- name: boltz_protein_screen
  description: Estimate and optionally start one protein-family screen.
- name: boltz_protein_design
  description: Estimate and optionally start one protein design job.
- name: boltz_download_results
  description: Start or resume downloading results for an existing Boltz job.
- name: boltz_job_status
  description: Check Boltz job progress, local result download state, or recent downloads.
deployment:
  mode: local-stdio
  verified: searched
