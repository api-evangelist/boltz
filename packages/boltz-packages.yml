description: >-
  First-party Boltz client libraries. Two families: (1) official Stainless-generated
  SDKs + CLI for the commercial Boltz Compute API (boltz-bio org), and (2) the
  open-source model packages for running Boltz-2 / BoltzGen locally (MIT license).
